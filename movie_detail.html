<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>무비픽 - 영화 상세정보</title>
    <style>
        body {
            margin: 0;
            font-family: 'Arial', sans-serif;
            background: #f4f4f4;
        }
        header {
            background: #222;
            color: #fff;
            padding: 1rem;
            text-align: center;
        }
        nav {
            background: #333;
            display: flex;
            justify-content: center;
            gap: 2rem;
            padding: 0.75rem;
        }
        nav a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }
        nav a:hover {
            text-decoration: underline;
        }
        main {
            max-width: 800px;
            margin: 2rem auto;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.07);
            padding: 2rem;
            display: flex;
            gap: 2rem;
        }
        .poster {
            min-width: 250px;
            max-width: 250px;
        }
        .poster img {
            width: 100%;
            border-radius: 8px;
        }
        .details {
            flex: 1;
        }
        .details h2 {
            margin-top: 0;
        }
        .info {
            color: #555;
            margin-bottom: 1rem;
        }
        .overview {
            margin-top: 1.5rem;
            font-size: 1.1rem;
            line-height: 1.6;
        }
        @media (max-width: 700px) {
            main {
                flex-direction: column;
                padding: 1rem;
            }
            .poster {
                max-width: 100%;
                min-width: 0;
                margin-bottom: 1rem;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>🎬 무비픽 - 영화 상세정보</h1>
    </header>
    <nav>
        <a href="index.html">메인페이지</a>
        <a href="search.html">영화검색</a>
        <a href="recommend.html">영화추천</a>
    </nav>
    <main>
        <div class="poster" id="poster"></div>
        <div class="details">
            <h2 id="movie-title">로딩 중...</h2>
            <div class="info" id="movie-info"></div>
            <div class="overview" id="movie-overview"></div>
        </div>
    </main>
    <footer>
        <p>&copy; 2025 무비픽 MoviePick</p>
    </footer>
    <script>
        const API_KEY = 'ae78ea0d67caa2167d072d71ea1a8990';

        // 1. URL에서 id 파라미터 추출
        const urlParams = new URLSearchParams(window.location.search);
        const movieId = urlParams.get('id');

        if (!movieId) {
            document.getElementById('movie-title').textContent = '영화 ID가 없습니다.';
        } else {
            // 2. TMDB API로 영화 상세정보 요청
            fetch(`https://api.themoviedb.org/3/movie/${movieId}?api_key=${API_KEY}&language=ko-KR`)
                .then(res => res.json())
                .then(data => {
                    // 3. 받아온 데이터를 HTML에 출력
                    document.getElementById('movie-title').textContent = data.title || data.name || '제목 없음';
                    document.getElementById('movie-overview').textContent = data.overview || '줄거리 정보가 없습니다.';

                    // 포스터
                    const posterDiv = document.getElementById('poster');
                    if (data.poster_path) {
                        posterDiv.innerHTML = `<img src="https://image.tmdb.org/t/p/w500${data.poster_path}" alt="포스터" />`;
                    } else {
                        posterDiv.innerHTML = `<div style="width:100%;height:350px;background:#eee;display:flex;align-items:center;justify-content:center;border-radius:8px;">No Image</div>`;
                    }

                    // 추가 정보
                    const infoArr = [];
                    if (data.release_date) infoArr.push(`개봉일: ${data.release_date}`);
                    if (data.runtime) infoArr.push(`러닝타임: ${data.runtime}분`);
                    if (data.genres && data.genres.length > 0) infoArr.push('장르: ' + data.genres.map(g => g.name).join(', '));
                    if (data.vote_average) infoArr.push(`평점: ${data.vote_average} / 10`);
                    document.getElementById('movie-info').textContent = infoArr.join(' | ');
                })
                .catch(() => {
                    document.getElementById('movie-title').textContent = '영화 정보를 불러오지 못했습니다.';
                });
        }
    </script>
</body>
</html>

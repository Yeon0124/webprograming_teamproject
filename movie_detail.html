<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>영화 상세 정보</title>
  <style>
    body {
      font-family: 'Arial', sans-serif;
      background-color: #f4f4f4;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .movie-detail-container {
      background-color: white;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
      width: 80%;
      max-width: 900px;
      padding: 2rem;
      margin: 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .movie-title {
      font-size: 2rem;
      margin-bottom: 1rem;
      color: #333;
      text-align: center;
    }
    .movie-poster {
      max-width: 200px;
      border-radius: 4px;
      margin-bottom: 1rem;
    }
    .movie-overview {
      font-size: 1rem;
      color: #555;
      line-height: 1.6;
      text-align: center;
    }
    .movie-info {
      margin-top: 1.5rem;
      font-size: 0.9rem;
      color: #777;
      text-align: center;
    }
    .movie-credits {
      margin-top: 1.5rem;
      font-size: 0.9rem;
      color: #777;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <header>
      <h1>🎬 무비픽 - 나만의 영화 추천</h1>
    </header>
    <nav>
      <a href="index.html">메인페이지</a>
      <a href="search.html">영화검색</a>
      <a href="recommend.html">영화추천</a>
    </nav>
  <div class="movie-detail-container">
    <h2 class="movie-title" id="movieTitle"></h2>
    <img id="moviePoster" class="movie-poster" src="" alt="영화 포스터">
    <p class="movie-overview" id="movieOverview"></p>
    <div class="movie-info">
      <p><strong>개봉일:</strong> <span id="movieReleaseDate"></span></p>
      <p><strong>평점:</strong> <span id="movieVoteAverage"></span></p>
    </div>
    <div class="movie-credits">
      <p><strong>감독:</strong> <span id="movieDirector"></span></p>
      <p><strong>배우:</strong> <span id="movieActors"></span></p>
    </div>
  </div>
  <footer><p>&copy; 2025 무비픽 MoviePick</p></footer>
  </div>
  <script>
    const API_KEY = 'ae78ea0d67caa2167d072d71ea1a8990';

    // URL에서 영화 ID 가져오기
    function getMovieIdFromUrl() {
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get('id');
    }

    // 영화 상세 정보 가져오기
    async function fetchMovieDetails(movieId) {
      try {
        const res = await fetch(`https://api.themoviedb.org/3/movie/${movieId}?api_key=${API_KEY}&language=ko-KR`);
        if (!res.ok) {
          throw new Error(`HTTP error! status: ${res.status}`);
        }
        const data = await res.json();
        return data;
      } catch (error) {
        console.error("영화 정보를 가져오는 데 실패했습니다:", error);
        return null;
      }
    }

    // 영화 크레딧 정보 가져오기 (감독, 배우)
    async function fetchMovieCredits(movieId) {
      try {
        const res = await fetch(`https://api.themoviedb.org/3/movie/${movieId}/credits?api_key=${API_KEY}&language=ko-KR`);
        if (!res.ok) {
          throw new Error(`HTTP error! status: ${res.status}`);
        }
        const data = await res.json();
        return data;
      } catch (error) {
        console.error("영화 크레딧 정보를 가져오는 데 실패했습니다:", error);
        return null;
      }
    }

    // 페이지에 영화 정보 표시
    async function displayMovieDetails() {
      const movieId = getMovieIdFromUrl();
      if (!movieId) {
        document.body.innerHTML = '<p>잘못된 접근입니다.</p>';
        return;
      }

      const movie = await fetchMovieDetails(movieId);
      if (!movie) {
        document.body.innerHTML = '<p>영화 정보를 찾을 수 없습니다.</p>';
        return;
      }

      const credits = await fetchMovieCredits(movieId);
       if (!credits) {
        document.body.innerHTML = '<p>영화 크레딧 정보를 찾을 수 없습니다.</p>';
        return;
      }

      document.getElementById('movieTitle').textContent = movie.title;
      document.getElementById('movieOverview').textContent = movie.overview;
      document.getElementById('movieReleaseDate').textContent = movie.release_date;
      document.getElementById('movieVoteAverage').textContent = movie.vote_average;

      const director = credits.crew.filter(member => member.job === 'Director').map(member => member.name).join(', ');
      const actors = credits.cast.slice(0, 5).map(actor => actor.name).join(', ');

      document.getElementById('movieDirector').textContent = director || '정보 없음';
      document.getElementById('movieActors').textContent = actors || '정보 없음';

      const posterPath = movie.poster_path
        ? `https://image.tmdb.org/t/p/w500${movie.poster_path}`
        : 'https://via.placeholder.com/200x300?text=No+Image';
      document.getElementById('moviePoster').src = posterPath;
    }

    window.onload = displayMovieDetails;
  </script>
</body>
</html>

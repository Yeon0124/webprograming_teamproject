<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>무비픽 - 영화 추천</title>
    <style>
        body {
            margin: 0;
            font-family: 'Arial', sans-serif;
            background: #f4f4f4;
        }

        header {
            background: #222;
            color: #fff;
            padding: 1rem;
            text-align: center;
        }

        nav {
            background: #333;
            display: flex;
            justify-content: center;
            gap: 2rem;
            padding: 0.75rem;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        nav a:hover {
            text-decoration: underline;
        }

        main {
            max-width: 900px;
            margin: 2rem auto;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.07);
            padding: 2rem;
        }

        h2 {
            margin-top: 0;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .form-group {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .form-group label {
            min-width: 100px;
            font-weight: bold;
        }

        .form-group input[type="text"],
        .form-group select {
            flex: 1;
            padding: 0.6rem;
            font-size: 1rem;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        .form-group input[type="checkbox"],
        .form-group input[type="radio"] {
            margin-right: 0.3rem;
        }

        .form-inline {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .platforms {
            display: flex;
            gap: 1.2rem;
        }

        .recommend-btn {
            padding: 0.8rem 1.5rem;
            font-size: 1.1rem;
            border: none;
            border-radius: 4px;
            background: #222;
            color: #fff;
            cursor: pointer;
            margin-top: 1rem;
        }

        .recommend-btn:hover {
            background: #444;
        }

        .results {
            margin-top: 2.5rem;
        }

        .movie-list {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .movie-card {
            background: #fafafa;
            border: 1px solid #ddd;
            border-radius: 6px;
            width: 180px;
            padding: 0.7rem;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.06);
            text-align: center;
            cursor: pointer;
            transition: box-shadow 0.2s;
        }

        .movie-card:hover {
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15);
        }

        .movie-card img {
            width: 100%;
            border-radius: 4px;
        }

        .movie-card h4 {
            margin: 0.5rem 0 0 0;
            font-size: 1rem;
        }
    </style>
</head>

<body>
    <header>
        <h1>🎲 무비픽 - 영화 추천</h1>
    </header>
    <nav>
        <a href="index.html">메인페이지</a>
        <a href="search.html">영화검색</a>
        <a href="recommend.html">영화추천</a>
    </nav>
    <main>
        <h2>영화 추천받기</h2>
        <form id="recommendForm" autocomplete="off">
            <div class="form-group">
                <label for="genre">장르</label>
                <select id="genre" name="genre">
                    <option value="">선택 안 함</option>
                    <!-- JS로 TMDB 장르 동적 생성 -->
                </select>
            </div>
            <div class="form-group">
                <label>관람 시간</label>
                <div class="form-inline">
                    <label><input type="radio" name="runtime" value="short" /> 90분 이하</label>
                    <label><input type="radio" name="runtime" value="medium" /> 90~120분</label>
                    <label><input type="radio" name="runtime" value="long" /> 120분 이상</label>
                    <label><input type="radio" name="runtime" value="" checked /> 상관없음</label>
                </div>
            </div>
            <div class="form-group">
                <label for="year">연도/시대</label>
                <select id="year" name="year">
                    <option value="">상관없음</option>
                    <option value="latest">최신 영화</option>
                    <option value="10s">2010년대 영화</option>
                    <option value="00s">2000년대 영화</option>
                    <option value="90s">90년대 영화</option>
                    <option value="80s">80년대 영화</option>
                    <option value="classic">고전 명작</option>
                </select>
            </div>
            <div class="form-group">
                <label for="language">언어</label>
                <select id="language" name="language">
                    <option value="">상관없음</option>
                    <!-- JS로 TMDB 언어 동적 생성 -->
                </select>
            </div>
            <div class="form-group">
                <label>시청 플랫폼</label>
                <div class="platforms">
                    <label><input type="checkbox" name="platform" value="8" /> 넷플릭스</label>
                    <label><input type="checkbox" name="platform" value="337" /> 디즈니+</label>
                    <label><input type="checkbox" name="platform" value="97" /> 왓챠</label>
                    <label><input type="checkbox" name="platform" value="356" /> 쿠팡플레이</label>
                </div>
            </div>
            <button type="submit" class="recommend-btn">추천받기</button>
        </form>
        <div class="results" id="results">
            <!-- 추천 결과 영화리스트가 여기에 출력됩니다 -->
        </div>
    </main>
    <footer>
        <p>&copy; 2025 무비픽 MoviePick</p>
    </footer>
    <script>
        const API_KEY = 'ae78ea0d67caa2167d072d71ea1a8990';

        function goToMovieDetail(movieId) {
            window.location.href = `movie_detail.html?id=${movieId}`;
        }
        // 장르 목록 채우기
        async function fillGenreOptions() {
            const res = await fetch(`https://api.themoviedb.org/3/genre/movie/list?api_key=${API_KEY}&language=ko-KR`);
            const data = await res.json();
            const select = document.getElementById('genre');
            data.genres.forEach(genre => {
                const opt = document.createElement('option');
                opt.value = genre.id;
                opt.textContent = genre.name;
                select.appendChild(opt);
            });
        }

        // 언어 목록 채우기
        async function fillLanguageOptions() {
            const res = await fetch(`https://api.themoviedb.org/3/configuration/languages?api_key=${API_KEY}`);
            const data = await res.json();
            const select = document.getElementById('language');
            data.forEach(lang => {
                const opt = document.createElement('option');
                opt.value = lang.iso_639_1;
                opt.textContent = lang.english_name + (lang.name ? ` (${lang.name})` : '');
                select.appendChild(opt);
            });
        }

        // 페이지 로드 시 필터 목록 채우기
        window.onload = function () {
            fillGenreOptions();
            fillLanguageOptions();
        };

        // 추천 폼 제출 시 TMDB API로 영화 추천
        document.getElementById('recommendForm').onsubmit = async function (e) {
            e.preventDefault();
            const form = e.target;

            // 장르
            const genre = form.genre.value;
            let genreParam = genre ? `&with_genres=${genre}` : '';

            // 언어
            const language = form.language.value;
            let languageParam = language ? `&with_original_language=${language}` : '';

            // 관람 시간
            let runtimeParam = '';
            if (form.runtime.value === 'short') runtimeParam = '&with_runtime.lte=90';
            else if (form.runtime.value === 'medium') runtimeParam = '&with_runtime.gte=90&with_runtime.lte=120';
            else if (form.runtime.value === 'long') runtimeParam = '&with_runtime.gte=120';

            // 연도/시대
            let yearParam = '';
            if (form.year.value === 'latest') yearParam = '&primary_release_date.gte=2020-01-01';
            else if (form.year.value === '10s') yearParam = '&primary_release_date.gte=2010-01-01&primary_release_date.lte=2019-12-31';
            else if (form.year.value === '00s') yearParam = '&primary_release_date.gte=2000-01-01&primary_release_date.lte=2009-12-31';
            else if (form.year.value === '90s') yearParam = '&primary_release_date.gte=1990-01-01&primary_release_date.lte=1999-12-31';
            else if (form.year.value === '80s') yearParam = '&primary_release_date.gte=1980-01-01&primary_release_date.lte=1989-12-31';
            else if (form.year.value === 'classic') yearParam = '&primary_release_date.lte=1970-12-31';

            // 플랫폼 (여러개 가능)
            const platforms = Array.from(form.querySelectorAll('input[name="platform"]:checked')).map(el => el.value);
            let platformParam = '';
            if (platforms.length > 0) platformParam = `&with_watch_providers=${platforms.join('|')}&watch_region=KR`;

            // 최종 API URL
            const url = `https://api.themoviedb.org/3/discover/movie?api_key=${API_KEY}&language=ko-KR${genreParam}${languageParam}${runtimeParam}${yearParam}${platformParam}&sort_by=popularity.desc`;

            document.getElementById('results').innerHTML =
                '<div style="color:#888; padding:2rem; text-align:center;">영화 추천 결과를 불러오는 중...</div>';

            try {
                const res = await fetch(url);
                const data = await res.json();
                if (data.results && data.results.length > 0) {
                    document.getElementById('results').innerHTML =
                        `<div class="movie-list">` +
                        data.results.map(movie => `
                            <div class="movie-card" onclick="goToMovieDetail(${movie.id})">
                                <img src="https://image.tmdb.org/t/p/w500${movie.poster_path || ''}" alt="포스터" />
                                <h4>${movie.title}</h4>
                            </div>
                        `).join('') +
                        `</div>`;
                } else {
                    document.getElementById('results').innerHTML =
                        '<div style="color:#888; padding:2rem; text-align:center;">조건에 맞는 영화를 찾을 수 없습니다.</div>';
                }
            } catch (err) {
                document.getElementById('results').innerHTML =
                    '<div style="color:#888; padding:2rem; text-align:center;">영화 추천 결과를 불러오지 못했습니다.</div>';
            }
        };
    </script>
</body>

</html>
